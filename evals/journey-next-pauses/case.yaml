schema_version: "1.0"
name: journey-next-pauses
description: In code-journey, after a step is committed and the user says to carry on, implement writes only the next unit file and pauses, with no code and no further unit files. Needs --scaffold and --allow-tools Write Edit Bash.
tags: [spine, implement, journey]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    We're in code-journey on docs/plans/2026-01-05-text-utils.md.
    Unit 01 is done and committed. Carry on.
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Write, Edit, Bash]
graders:
  - type: tool_used
    name: implement-fired
    tool: Skill
    input_match: "implement"
    arm: with-only
  - type: llm
    name: one-unit-then-pause
    focus: trace
    criteria: |
      - The run wrote docs/plans/2026-01-05-text-utils/units/02-*.md with "The picture" and a "How we'll know" line naming `python3 -m unittest tests.test_utils -k safe_filename`.
      - It wrote no units/03-* file (step 3 gets its unit only after step 2 is committed).
      - No Edit or Write touched utils.py or tests/test_utils.py, and no Agent call was made to code a step.
      - The final message points to unit 02's file and asks the user to say go, ask a question, or change it; the unit file itself holds no "say go" line.
