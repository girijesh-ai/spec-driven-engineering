schema_version: "1.0"
name: journey-pause-before
description: In code-journey, implement writes the first unit file and stops for the engineer before any code. Needs --scaffold and --allow-tools Write Edit.
tags: [spine, implement, journey]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The plan in docs/plans/2026-01-05-text-utils.md is approved: go.
    Use code-journey.
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Write, Edit]
graders:
  - type: tool_used
    name: implement-fired
    tool: Skill
    input_match: "implement"
    arm: with-only
  - type: regex
    name: wrote-unit-1
    target: trace
    pattern: "docs/plans/2026-01-05-text-utils/units/01-"
  - type: llm
    name: pauses-before-code
    focus: trace
    criteria: |
      - A unit file was written under docs/plans/2026-01-05-text-utils/units/ whose name starts with 01-.
      - It has a short plain-language "The picture" section at the top, and a "How we'll know" section naming `python3 -m unittest tests.test_utils -k slugify`.
      - The final message points to the unit file and asks the user to read it and say go.
      - Nothing was written to utils.py or tests/, and no Agent call was made.
