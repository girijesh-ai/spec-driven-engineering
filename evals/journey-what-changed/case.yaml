schema_version: "1.0"
name: journey-what-changed
description: In code-journey, after "go" implement codes the step, writes a plain What changed note in the unit file, and stops before committing. Needs --scaffold and --allow-tools Write Edit Bash.
tags: [spine, implement, journey]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    We're in code-journey on docs/plans/2026-01-05-text-utils.md.
    I've read docs/plans/2026-01-05-text-utils/units/01-slugify.md: go.
  max_turns: 40
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Write, Edit, Bash]
graders:
  - type: tool_used
    name: implement-fired
    tool: Skill
    input_match: "implement"
    arm: with-only
  - type: tool_used
    name: coded-on-sonnet
    tool: Agent
    input_match: '"model"\s*:\s*"sonnet"'
  - type: llm
    name: note-then-pause
    focus: trace
    criteria: |
      - The main session re-ran `python3 -m unittest tests.test_utils -k slugify` itself after the Agent call, and it passed.
      - units/01-slugify.md gained a "What changed" section in plain words that quotes a few lines of the diff and gives the test result.
      - The final message points to that section and asks the user to say next; nothing was committed after the scaffold's first commit.
      - Step 2 (safe_filename) was not started.
