schema_version: "1.0"
name: implement-asks-mode
description: With an approved plan and no mode named, implement asks code-auto or code-journey before touching code. Needs --scaffold and --allow-tools Write Edit.
tags: [spine, implement]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The plan in docs/plans/2026-01-05-text-utils.md is approved: go.
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Write, Edit]
graders:
  - type: tool_used
    name: implement-fired
    tool: Skill
    input_match: "implement"
    arm: with-only
  - type: regex
    name: names-both-modes
    target: last_message
    pattern: "code-auto[\\s\\S]*code-journey|code-journey[\\s\\S]*code-auto"
  - type: llm
    name: asks-before-coding
    focus: trace
    criteria: |
      - The final message asks the user to choose code-auto or code-journey and presents code-auto as the default.
      - Nothing was written to utils.py or tests/ and no Agent call was made before the question.
